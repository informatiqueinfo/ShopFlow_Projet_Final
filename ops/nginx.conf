events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_x_client_id $shopflow_client_id {
    default $http_x_client_id;
    "" $remote_addr;
  }
  upstream shopflow_gateway {
    server gateway:8000 resolve;
    zone backends 64k;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://shopflow_gateway;
      proxy_connect_timeout 1s;
      proxy_read_timeout 3s;
      proxy_set_header X-Client-Id $shopflow_client_id;
      proxy_set_header Idempotency-Key $http_idempotency_key;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}

global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: gateway
    dns_sd_configs:
      - names: [gateway]
        type: A
        port: 8000
        refresh_interval: 10s
    metrics_path: /metrics
  - job_name: stock
    static_configs:
      - targets: [stock:8080]
  - job_name: payment
    static_configs:
      - targets: [payment:8081]

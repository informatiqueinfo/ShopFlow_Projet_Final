apiVersion: v1
kind: Namespace
metadata:
  name: shopflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopflow-stock
  namespace: shopflow
spec:
  replicas: 1
  selector: {matchLabels: {app: shopflow-stock}}
  template:
    metadata: {labels: {app: shopflow-stock}}
    spec:
      containers:
        - name: stock
          image: shopflow-final:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "shopflow.stock"]
          env:
            - {name: PORT, value: "8080"}
          ports: [{containerPort: 8080}]
          startupProbe:
            httpGet: {path: /health/startup, port: 8080}
            failureThreshold: 12
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            periodSeconds: 3
          resources:
            requests: {cpu: 30m, memory: 48Mi}
            limits: {cpu: 300m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: shopflow-stock, namespace: shopflow}
spec:
  selector: {app: shopflow-stock}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shopflow-payment, namespace: shopflow}
spec:
  replicas: 1
  selector: {matchLabels: {app: shopflow-payment}}
  template:
    metadata: {labels: {app: shopflow-payment}}
    spec:
      containers:
        - name: payment
          image: shopflow-final:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "shopflow.payment"]
          env:
            - {name: PORT, value: "8081"}
          ports: [{containerPort: 8081}]
          startupProbe:
            httpGet: {path: /health/startup, port: 8081}
            failureThreshold: 12
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: 8081}
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: 8081}
            periodSeconds: 3
          resources:
            requests: {cpu: 30m, memory: 48Mi}
            limits: {cpu: 300m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: shopflow-payment, namespace: shopflow}
spec:
  selector: {app: shopflow-payment}
  ports: [{port: 8081, targetPort: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shopflow-gateway, namespace: shopflow}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: shopflow-gateway}}
  template:
    metadata: {labels: {app: shopflow-gateway}}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: gateway
          image: shopflow-final:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "shopflow.gateway"]
          env:
            - {name: PORT, value: "8000"}
            - {name: STOCK_URL, value: "http://shopflow-stock:8080"}
            - {name: PAYMENT_URL, value: "http://shopflow-payment:8081"}
            - {name: RESILIENCE_ENABLED, value: "1"}
          ports: [{containerPort: 8000}]
          startupProbe:
            httpGet: {path: /health/startup, port: 8000}
            failureThreshold: 12
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 400m, memory: 160Mi}
---
apiVersion: v1
kind: Service
metadata: {name: shopflow-gateway, namespace: shopflow}
spec:
  selector: {app: shopflow-gateway}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: shopflow-gateway-pdb, namespace: shopflow}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: shopflow-gateway}}

name: ShopFlow CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilation
        run: python -m compileall -q shopflow chaos tests
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
